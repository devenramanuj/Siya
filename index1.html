<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya AI - Ancient Script Expert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- OpenCV.js ઉમેર્યું -->
    <script async src="https://docs.opencv.org/4.1.0/opencv.js" onload="onOpenCvReady()"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; font-family: 'Segoe UI', sans-serif; user-select: none; }
        
        /* --- VIDEO LAYER --- */
        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: cover; position: absolute; display: none; }
        #silent-video { display: block; }
        
        #camera-feed { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 5; border: 4px solid #008cff; }
        canvas { display: none; } /* આને કદાચ છુપાવવાને બદલે tempCanvas તરીકે ઉપયોગ કરી શકાય */

        /* --- UI LAYER --- */
        .side-btn { position: fixed; top: 20px; right: 20px; z-index: 20; background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.2); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; padding: 20px; box-sizing: border-box; justify-content: center; align-items: center; }
        .settings-box { background: #222; padding: 25px; border-radius: 15px; width: 90%; max-width: 350px; border: 1px solid #ff4500; color: white; text-align: center; }
        
        /* રિપોર્ટ સ્ટાઇલ */
        #report-modal { overflow-y: auto; }
        .report-box { background: #fff; color: #333; padding: 25px; border-radius: 20px; width: 95%; max-width: 600px; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .report-header { text-align: center; border-bottom: 2px solid #ff4500; margin-bottom: 15px; padding-bottom: 10px; }
        .report-header h2 { color: #ff4500; margin: 0; font-size: 22px; }
        .report-content { line-height: 1.6; font-size: 16px; max-height: 400px; overflow-y: auto; padding-right: 10px; }
        
        .report-footer { display: flex; gap: 10px; margin-top: 20px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .copy-btn { background: #008cff; color: white; }
        .close-btn { background: #333; color: white; }

        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #333; color: white; border: 1px solid #555; border-radius: 5px; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 12px; background: #ff4500; border: none; font-weight: bold; cursor: pointer; color: white; border-radius: 5px; }

        #mic-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; width: 100%; }
        #status-text { color: white; margin-bottom: 15px; font-size: 14px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .controls-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .round-btn { width: 55px; height: 55px; border-radius: 50%; border: none; color: white; font-size: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        #mic-btn { width: 70px; height: 70px; background: #ff4500; font-size: 28px; }
        #gallery-btn { background: #00ff88; color: black; }
        #stop-speech-btn { background: #ff0000; }
        #vision-btn { background: #008cff; }
        #capture-btn { background: #ff4500; display: none; } 
        
        .listening { animation: pulse 1.5s infinite; background: red !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="silent-video" autoplay muted loop playsinline><source src="silent.mp4" type="video/mp4"></video>
        <video id="talking-video" muted loop playsinline><source src="talking.mp4" type="video/mp4"></video>
        <video id="thinking-video" muted loop playsinline><source src="thinking.mp4" type="video/mp4"></video>
        <video id="smiling-video" muted loop playsinline><source src="smiling.mp4" type="video/mp4"></video>
    </div>
    
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="canvas-capture"></canvas>
    <input type="file" id="gallery-input" accept="image/*" style="display:none" onchange="handleGalleryUpload(event)">

    <button class="side-btn" onclick="openSettings()"><i class="fas fa-cog"></i></button>

    <div id="settings-modal" class="modal">
        <div class="settings-box">
            <h3>સિયા AI સેટિંગ્સ</h3>
            <input type="text" id="userNameInput" placeholder="તમારું નામ">
            <select id="geminiModelSelect">
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
            </select>
            <textarea id="geminiKeyInput" rows="3" placeholder="API Keys..."></textarea>
            <button class="save-btn" onclick="saveSettings()">સેવ કરો</button>
        </div>
    </div>

    <div id="report-modal" class="modal">
        <div class="report-box">
            <div class="report-header">
                <h2>પૌરાણિક લિપિ વિશ્લેષણ</h2>
                <small id="report-date"></small>
            </div>
            <div id="report-body" class="report-content">
                <p>વિશ્લેષણ ચાલુ છે...</p> 
            </div>
            <div class="report-footer">
                <button class="action-btn copy-btn" onclick="copyReport()"><i class="fas fa-copy"></i> કોપી</button>
                <button class="action-btn close-btn" onclick="closeReport()">બંધ કરો</button>
            </div>
        </div>
    </div>

    <div id="mic-container">
        <div id="status-text">જય શ્રી કૃષ્ણ</div>
        <div class="controls-row">
            <button id="gallery-btn" class="round-btn" onclick="document.getElementById('gallery-input').click()"><i class="fas fa-image"></i></button>
            <button id="mic-btn" class="round-btn" onclick="startConversation()"><i class="fas fa-microphone"></i></button>
            <button id="stop-speech-btn" class="round-btn" onclick="stopSpeech()"><i class="fas fa-volume-mute"></i></button>
            <button id="vision-btn" class="round-btn" onclick="toggleVisionMode()"><i class="fas fa-camera"></i></button>
            <button id="capture-btn" class="round-btn" onclick="captureAndAnalyze()"><i class="fas fa-camera"></i></button>
        </div>
    </div>

    <script>
        let userName = localStorage.getItem('vidushi_username') || "દેવેન્દ્રભાઈ";
        let geminiKeys = localStorage.getItem('vidushi_gemini_key') || "";
        let selectedModel = localStorage.getItem('vidushi_model') || "gemini-2.5-flash";
        
        const videos = {
            silent: document.getElementById('silent-video'),
            talking: document.getElementById('talking-video'),
            thinking: document.getElementById('thinking-video'),
            smiling: document.getElementById('smiling-video')
        };
        const statusText = document.getElementById('status-text');
        const cameraFeed = document.getElementById('camera-feed');
        const canvas = document.getElementById('canvas-capture');
        const captureButton = document.getElementById('capture-btn');

        let isAiSpeaking = false, visionMode = false, cameraStream = null, recognition = null;
        let opencvInitialized = false; // OpenCV ઇનિશિયલાઇઝ થયું છે કે નહીં તેનો ટ્રેક રાખવા

        // OpenCV લાઇબ્રેરી લોડ થયા પછી આ ફંક્શન કોલ થશે
        function onOpenCvReady() {
            opencvInitialized = true;
            console.log("OpenCV.js is ready!");
            // તમે અહીં કોઈ પ્રારંભિક OpenCV કાર્ય કરી શકો છો, જો જરૂરી હોય તો
        }

        window.onload = () => {
            Object.values(videos).forEach(video => {
                video.oncanplay = () => {
                    if (video.id === 'silent-video' && video.style.display !== 'none') {
                        video.play().catch(e => console.error("Video play failed:", e));
                    }
                };
            });

            playVideo('smiling');
            setTimeout(() => { 
                speak(`જય શ્રી કૃષ્ણ ${userName} મારું નામ સિયા છે આજે આપણે કઈ લિપિ ઉકેલવી છે`); 
            }, 1000);
        };

        function playVideo(type) {
            Object.values(videos).forEach(v => { 
                v.style.display = 'none'; 
                v.pause(); 
                v.currentTime = 0;
            });
            if(videos[type]) { 
                videos[type].style.display = 'block'; 
                videos[type].play().catch(e => console.error(`Error playing ${type} video:`, e)); 
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            let clean = text.replace(/[.,!?;:*#_]/g, "");
            isAiSpeaking = true;
            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'gu-IN';
            u.rate = 0.8;
            u.onstart = () => playVideo('talking');
            u.onend = () => { 
                if(isAiSpeaking) {
                    playVideo('smiling'); 
                    isAiSpeaking = false; 
                    setTimeout(() => { if(!isAiSpeaking) playVideo('silent'); }, 3000);
                }
            };
            u.onerror = (event) => {
                console.error('SpeechSynthesisUtterance.onerror', event);
                isAiSpeaking = false;
                playVideo('silent');
            };
            window.speechSynthesis.speak(u);
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            isAiSpeaking = false;
            playVideo('silent');
            statusText.innerText = "અવાજ બંધ કર્યો";
        }

        function closeReport() {
            document.getElementById('report-modal').style.display = 'none';
            stopSpeech();
        }

        function copyReport() {
            const text = document.getElementById('report-body').innerText;
            navigator.clipboard.writeText(text)
                .then(() => statusText.innerText = "રિપોર્ટ કોપી થઈ ગયો છે")
                .catch(err => console.error('Copy failed:', err));
        }

        async function toggleVisionMode() {
            if(visionMode) {
                if(cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                cameraFeed.style.display = 'none';
                captureButton.style.display = 'none';
                visionMode = false;
                statusText.innerText = "વિઝન મોડ બંધ";
                playVideo('silent');
                speak("વિઝન મોડ બંધ કરવામાં આવ્યો છે");
            } else {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    cameraFeed.srcObject = cameraStream;
                    cameraFeed.style.display = 'block';
                    captureButton.style.display = 'flex';
                    visionMode = true;
                    statusText.innerText = "કેમેરા સામે લિપિ રાખો";
                    speak("કૃપા કરીને લિપિ સામે કેમેરો રાખો અને કેપ્ચર બટન દબાવો");
                } catch(e) { 
                    statusText.innerText = "કેમેરો ખોલવામાં નિષ્ફળ";
                    console.error("કેમેરો ખોલવામાં નિષ્ફળ:", e);
                    speak("કેમેરો ખોલવામાં નિષ્ફળ, કૃપા કરીને પરવાનગી તપાસો");
                }
            }
        }

        async function captureAndAnalyze() {
            if (!visionMode || !cameraStream) {
                statusText.innerText = "કેમેરા મોડ સક્રિય નથી";
                speak("કેમેરા મોડ સક્રિય નથી, કૃપા કરીને વિઝન બટન દબાવીને કેમેરો ચાલુ કરો");
                return;
            }

            canvas.width = cameraFeed.videoWidth;
            canvas.height = cameraFeed.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraFeed, 0, 0, canvas.width, canvas.height);
            
            if(cameraStream) cameraStream.getTracks().forEach(track => track.stop());
            cameraFeed.style.display = 'none';
            captureButton.style.display = 'none';
            visionMode = false;

            // OpenCV પ્રી-પ્રોસેસિંગ લાગુ કરો
            const originalBase64 = canvas.toDataURL('image/jpeg', 0.9); // ઉચ્ચ ગુણવત્તા
            if (opencvInitialized) {
                statusText.innerText = "છબી પ્રક્રિયા કરી રહ્યું છે...";
                const preprocessedBase64 = await preprocessImage(originalBase64);
                generateSiyaReport(preprocessedBase64);
            } else {
                // જો OpenCV લોડ ન થયું હોય તો સીધી જ મૂળ છબી મોકલો
                console.warn("OpenCV.js not initialized, sending original image.");
                generateSiyaReport(originalBase64.split(',')[1]);
            }
        }

        function handleGalleryUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            statusText.innerText = "ગેલેરીમાંથી છબી અપલોડ કરી રહ્યું છે...";
            playVideo('thinking');

            const reader = new FileReader();
            reader.onload = async (e) => { // async બનાવ્યું
                const originalBase64 = e.target.result;
                if (opencvInitialized) {
                    statusText.innerText = "છબી પ્રક્રિયા કરી રહ્યું છે...";
                    const preprocessedBase64 = await preprocessImage(originalBase64);
                    generateSiyaReport(preprocessedBase64);
                } else {
                    console.warn("OpenCV.js not initialized, sending original image.");
                    generateSiyaReport(originalBase64.split(',')[1]);
                }
            };
            reader.onerror = (e) => {
                statusText.innerText = "છબી અપલોડ કરવામાં ભૂલ";
                console.error("Error reading file:", e);
                playVideo('silent');
                speak("ગેલેરીમાંથી છબી અપલોડ કરવામાં ભૂલ થઈ");
            };
            reader.readAsDataURL(file);
        }

        // OpenCV.js નો ઉપયોગ કરીને ઇમેજ પ્રી-પ્રોસેસિંગ ફંક્શન
        async function preprocessImage(imgDataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const src = cv.imread(img);
                    let dst = new cv.Mat();
                    
                    // 1. Grayscale
                    cv.cvtColor(src, src, cv.COLOR_RGBA2GRAY, 0);

                    // 2. Noise Removal (ઓછા નોઈઝ માટે)
                    cv.medianBlur(src, src, 3); // 3x3 median filter

                    // 3. Adaptive Thresholding (લિપિને પૃષ્ઠભૂમિથી સ્પષ્ટ કરવા માટે)
                    cv.adaptiveThreshold(src, dst, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 11, 2);
                    
                    // Display pre-processed image on a hidden canvas to get new dataURL
                    // તમે અહીં canvas element (id='canvas-capture') નો પણ ઉપયોગ કરી શકો છો
                    let tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    cv.imshow(tempCanvas, dst);
                    const processedDataUrl = tempCanvas.toDataURL('image/jpeg', 0.95); // Highest quality for pre-processed image
                    
                    src.delete();
                    dst.delete();
                    resolve(processedDataUrl.split(',')[1]); // base64 part પરત કરો
                };
                img.src = imgDataUrl;
            });
        }

        async function generateSiyaReport(base64) {
            playVideo('thinking');
            statusText.innerText = "લિપિનું વિશ્લેષણ ચાલુ છે...";
            
            // પ્રોમ્પ્ટને વધુ વિગતવાર અને "ઉકેલવા" પર ભાર મૂકવા માટે સુધાર્યો છે
            const prompt = `તમે સિયા છો, એક અદ્યતન AI પૌરાણિક લિપિ નિષ્ણાત. તમને એક છબી આપવામાં આવશે જેમાં પ્રાચીન લિપિ અથવા શિલાલેખ હોઈ શકે છે. તમારું પ્રાથમિક કાર્ય આ લિપિને **કોઈપણ સંજોગોમાં ઉકેલવું** અને તેનું **સંતોષકારક અને સંપૂર્ણ અર્થઘટન** પ્રદાન કરવું છે. જો કેટલાક અક્ષરો અસ્પષ્ટ હોય, તો પણ તમારે સંદર્ભ, ઐતિહાસિક જ્ઞાન અને તાર્કિક અનુમાનનો ઉપયોગ કરીને શક્ય તેટલું શ્રેષ્ઠ અને સૌથી સચોટ ભાષાંતર પ્રદાન કરવું આવશ્યક છે. જો તમને અક્ષરોને ઓળખવામાં કે ભાષાંતર કરવામાં કોઈ પડકારનો સામનો કરવો પડે, તો પણ તમારે તમારી મર્યાદાઓ સ્પષ્ટપણે જણાવવાને બદલે, **સર્વોત્તમ સંભવિત અર્થઘટન અને અનુમાન** પ્રદાન કરવાનો પ્રયાસ કરવો જોઈએ.

            તમારા રિપોર્ટમાં નીચેના મુદ્દાઓ ગુજરાતીમાં શામેલ હોવા જોઈએ:
            1.  **લિપિ ઓળખ:** છબીમાં કઈ લિપિ છે તે ઓળખો (દા.ત., બ્રાહ્મી, ખરોષ્ઠી, ગુપ્ત, દેવનાગરી, વગેરે). જો લિપિ સ્પષ્ટ ન હોય તો પણ, ઉપલબ્ધ પુરાવાઓના આધારે **સૌથી સંભવિત લિપિ પ્રકાર** અને તમારા અનુમાન માટેના કારણો આપો.
            2.  **અનુવાદ અને અર્થઘટન:** લિપિનું શક્ય હોય તેટલું **ચોક્કસ ગુજરાતીમાં ભાષાંતર** કરો. જો કેટલાક અક્ષરો સ્પષ્ટ ન હોય, તો પણ સંદર્ભ, વ્યાકરણ અને ભાષાકીય જ્ઞાનનો ઉપયોગ કરીને તેનું **સંભવિત અને તાર્કિક અર્થઘટન** પ્રદાન કરો. કોઈ પણ ભાગને વણઉકેલ્યો છોડશો નહીં.
            3.  **સમયગાળો:** આ લિપિ કયા સમયગાળાની હોઈ શકે છે તે અંગે **સચોટ અનુમાન** કરો અને તમારા અનુમાન માટે ઐતિહાસિક સંદર્ભો આપો.
            4.  **સાંસ્કૃતિક અને ઐતિહાસિક મહત્વ:** સનાતન ધર્મ અથવા ભારતીય ઇતિહાસના દ્રષ્ટિકોણથી આ લિપિનું **વિગતવાર અને ઊંડાણપૂર્વકનું મહત્વ** સમજાવો. તેના સામાજિક, ધાર્મિક કે રાજકીય પ્રભાવોની ચર્ચા કરો.
            5.  **વધારાની માહિતી:** જો કોઈ અન્ય સંબંધિત ઐતિહાસિક અથવા સાંસ્કૃતિક તથ્યો હોય તો તે ઉમેરો, જે આ લિપિના મહત્વને વધુ સ્પષ્ટ કરે.

            કૃપા કરીને આ રિપોર્ટને મુદ્દાસર, સ્પષ્ટ અને સમજવામાં સરળ ગુજરાતીમાં રજૂ કરો. દરેક મુદ્દો નવા ફકરામાં હોય તો સારું. પંચ્યુએશન માર્કનો ઉપયોગ કરશો નહીં. તમારું લક્ષ્ય **પરફેક્ટ અને સંતોષકારક** પરિણામ પ્રદાન કરવાનું છે.`;

            const keys = geminiKeys.split(',').map(k => k.trim()).filter(k => k);
            if(!keys.length) {
                speak("સેટિંગ્સમાં API કી ઉમેરો");
                statusText.innerText = "API કી નથી મળી";
                playVideo('silent');
                return;
            }
            const key = keys[Math.floor(Math.random() * keys.length)];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${key}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }] })
                });
                const data = await res.json();
                
                if (data.candidates && data.candidates.length > 0 && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts.length > 0) {
                    let reportText = data.candidates[0].content.parts[0].text;
                    reportText = reportText.replace(/[.,!?;:*#_]/g, "");

                    document.getElementById('report-date').innerText = new Date().toLocaleDateString('gu-IN');
                    document.getElementById('report-body').innerHTML = reportText.split('\n').map(line => `<p>${line}</p>`).join('');
                    document.getElementById('report-modal').style.display = 'flex';
                    
                    playVideo('smiling');
                    statusText.innerText = "રિપોર્ટ તૈયાર છે";
                    speak("મેં લિપિનું વિશ્લેષણ કરી લીધું છે લેખિત રિપોર્ટ તમારી સ્ક્રીન પર છે");
                } else {
                    console.error("Gemini API નો અમાન્ય પ્રતિસાદ:", data);
                    speak("ક્ષમા કરજો અત્યારે વિશ્લેષણ થઈ શક્યું નથી અમાન્ય પ્રતિસાદ મળ્યો છે");
                    statusText.innerText = "વિશ્લેષણ નિષ્ફળ: અમાન્ય પ્રતિસાદ";
                    playVideo('silent');
                }

            } catch(e) { 
                console.error("વિશ્લેષણ દરમિયાન ભૂલ:", e);
                speak("ક્ષમા કરજો અત્યારે વિશ્લેષણ થઈ શક્યું નથી કૃપા કરીને તમારું નેટવર્ક અને API કી તપાસો");
                statusText.innerText = "વિશ્લેષણ નિષ્ફળ: " + e.message;
                playVideo('silent');
            }
        }

        function openSettings() { 
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('userNameInput').value = userName;
            document.getElementById('geminiKeyInput').value = geminiKeys;
            document.getElementById('geminiModelSelect').value = selectedModel;
        }

        function saveSettings() {
            localStorage.setItem('vidushi_username', document.getElementById('userNameInput').value);
            localStorage.setItem('vidushi_gemini_key', document.getElementById('geminiKeyInput').value);
            localStorage.setItem('vidushi_model', document.getElementById('geminiModelSelect').value);
            
            userName = document.getElementById('userNameInput').value;
            geminiKeys = document.getElementById('geminiKeyInput').value;
            selectedModel = document.getElementById('geminiModelSelect').value;

            document.getElementById('settings-modal').style.display = 'none';
            statusText.innerText = "સેટિંગ્સ સેવ થઈ ગયા છે";
            speak("સેટિંગ્સ સેવ થઈ ગયા છે");
        }

        function startConversation() { 
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) {
                statusText.innerText = "માઈક સપોર્ટ નથી";
                speak("ક્ષમા કરજો તમારું બ્રાઉઝર સ્પીચ રેકગ્નિશન સપોર્ટ કરતું નથી");
                return;
            }
            
            if (recognition) {
                recognition.stop();
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'gu-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => { statusText.innerText = "સિયા સાંભળે છે..."; document.getElementById('mic-btn').classList.add('listening'); };
            recognition.onend = () => { 
                document.getElementById('mic-btn').classList.remove('listening'); 
                statusText.innerText = "જય શ્રી કૃષ્ણ";
            };
            recognition.onresult = (e) => { 
                const transcript = e.results[0][0].transcript;
                statusText.innerText = `તમે કહ્યું: ${transcript}`;
                processTextCommand(transcript); 
            };
            recognition.onerror = (event) => {
                console.error('Speech recognition error', event);
                statusText.innerText = "સ્પીચ રેકગ્નિશનમાં ભૂલ થઈ";
                playVideo('silent');
                speak("સ્પીચ રેકગ્નિશનમાં ભૂલ થઈ કૃપા કરીને ફરી પ્રયાસ કરો");
                document.getElementById('mic-btn').classList.remove('listening');
            };
            recognition.start();
        }

        async function processTextCommand(text) {
            playVideo('thinking');
            statusText.innerText = "તમારા પ્રશ્ન પર વિચાર કરી રહી છે...";

            const keys = geminiKeys.split(',').map(k => k.trim()).filter(k => k);
            if(!keys.length) {
                speak("સેટિંગ્સમાં API કી ઉમેરો");
                statusText.innerText = "API કી નથી મળી";
                playVideo('silent');
                return;
            }
            const key = keys[Math.floor(Math.random() * keys.length)];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${key}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `તારું નામ સિયા છે. એક પ્રાચીન લિપિ નિષ્ણાત તરીકે, ગુજરાતીમાં પ્રત્યુત્તર આપ. પંચ્યુએશન વગર જવાબ આપ: ${text}` }] }] })
                });
                const data = await res.json();
                
                if (data.candidates && data.candidates.length > 0 && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts.length > 0) {
                    let aiResponse = data.candidates[0].content.parts[0].text;
                    aiResponse = aiResponse.replace(/[.,!?;:*#_]/g, "");
                    speak(aiResponse);
                } else {
                    console.error("Gemini API નો અમાન્ય પ્રતિસાદ (વૉઇસ કમાન્ડ):", data);
                    speak("ક્ષમા કરજો તમારા પ્રશ્નનો જવાબ આપવામાં અમાન્ય પ્રતિસાદ મળ્યો છે");
                    statusText.innerText = "પ્રશ્નનો જવાબ નિષ્ફળ: અમાન્ય પ્રતિસાદ";
                    playVideo('silent');
                }

            } catch(e) { 
                console.error("વૉઇસ કમાન્ડ પ્રક્રિયા દરમિયાન ભૂલ:", e);
                speak("નેટવર્ક ચેક કરો અથવા API કી તપાસો");
                statusText.innerText = "પ્રશ્નનો જવાબ નિષ્ફળ: " + e.message;
                playVideo('silent');
            }
        }
    </script>
